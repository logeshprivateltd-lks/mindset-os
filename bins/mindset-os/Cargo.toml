[package]
name = "mindset-os"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MindSet OS — Pure-Rust Native Desktop Visual Computing Shell"

[lib]
name = "mindset_os"
path = "src/lib.rs"

[[bin]]
name = "mindset-os"
path = "src/main.rs"

[[bin]]
name = "mindset-shell"
path = "src/bin/mindset-shell.rs"

[dependencies]
mindset-core = { path = "../../crates/mindset-core" }
mindset-sys = { path = "../../crates/mindset-sys" }
mindset-intelligence = { path = "../../crates/mindset-intelligence" }
mindset-motion = { path = "../../crates/mindset-motion" }
mindset-net = { path = "../../crates/mindset-net" }
iced = { version = "0.14.0", features = ["wgpu", "tokio", "image", "canvas", "advanced"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tokio = { workspace = true }
chrono = { workspace = true }
sysinfo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
env_logger = { workspace = true }
rodio = "0.19"
rfd = "0.15"
