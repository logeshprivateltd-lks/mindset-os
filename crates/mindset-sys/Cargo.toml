[package]
name = "mindset-sys"
version = "1.0.0"
edition = "2021"
authors = ["LKS PVT LTD"]
license = "Proprietary"
description = "MindSet OS Native System Services, SQLite WAL Persistence, Hardware Sensors & AI Engine"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sysinfo = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled", "backup", "blob"] }
bcrypt = "0.17"
sha2 = "0.10"
dirs = { workspace = true }
async-trait = { workspace = true }
ed25519-dalek = "3.0.0"
connect-protocol = { path = "../mindset-connect-protocol", package = "mindset-connect-protocol" }
focus-policy-engine = { path = "../mindset-focus-policy", package = "mindset-focus-policy" }
