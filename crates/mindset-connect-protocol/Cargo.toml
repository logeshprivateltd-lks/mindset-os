[package]
name = "mindset-connect-protocol"
version = "1.0.0"
edition = "2021"
authors = ["LKS PVT LTD"]
license = "Proprietary"
description = "MindSet OS Cross-Device Peer Pairing & Conflict Resolution Protocol"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
