[workspace]
resolver = "2"
members = [
    "crates/mindset-core",
    "crates/mindset-sys",
    "crates/mindset-connect-protocol",
    "crates/mindset-focus-policy",
    "crates/mindset-motion",
    "crates/mindset-intelligence",
    "crates/mindset-net",
    "crates/whole_inspector_plugin",
    "services/mindset-focus-guard",
    "bins/mindset-os",
    "tests",
]
default-members = [
    "bins/mindset-os",
    "tests",
]

[workspace.package]
version = "1.3.0"
edition = "2021"
authors = ["LKS PVT LTD <engineering@lkspvtltd.com>"]
license = "Proprietary"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6.0"
async-trait = "0.1"
env_logger = "0.11"
