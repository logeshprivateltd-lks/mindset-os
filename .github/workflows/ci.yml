name: MindSet OS Pure-Rust CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  rust-verify:
    name: Format, Clippy & Workspace Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/*/Cargo.toml', 'services/*/Cargo.toml', 'bins/*/Cargo.toml', 'tests/Cargo.toml') }}

      - name: Install Linux GUI Build Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (Zero Warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Test Suite
        run: cargo test --workspace
