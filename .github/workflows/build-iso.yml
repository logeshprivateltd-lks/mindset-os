name: Build MindSet OS Debian 13 Live ISO

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-debian13-iso:
    name: Build & Verify Debian 13 Trixie ISO (mindset-shell + labwc)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Runner Disk Space & Loop Devices
        run: |
          sudo modprobe loop || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          mkdir -p "${{ runner.temp }}/cargo-registry" "${{ runner.temp }}/cargo-git"
          df -h

      - name: Cache Cargo Registry for Debian 13 Container
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/cargo-registry
            ${{ runner.temp }}/cargo-git
          key: trixie-cargo-reg-${{ hashFiles('**/Cargo.toml') }}

      - name: Compile Rust Binaries & Build Debian 13 ISO in Trixie Container
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ runner.temp }}/cargo-registry:/root/.cargo/registry" \
            -v "${{ runner.temp }}/cargo-git:/root/.cargo/git" \
            -w /workspace \
            debian:trixie \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              echo "Acquire::Retries \"3\";" > /etc/apt/apt.conf.d/99mindset
              echo "Acquire::http::Timeout \"30\";" >> /etc/apt/apt.conf.d/99mindset
              echo "Acquire::https::Timeout \"30\";" >> /etc/apt/apt.conf.d/99mindset

              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                pkg-config \
                libssl-dev \
                libasound2-dev \
                libudev-dev \
                libwayland-dev \
                libx11-dev \
                libx11-xcb-dev \
                libxkbcommon-dev \
                libxkbcommon-x11-dev \
                libvulkan-dev \
                live-build \
                debootstrap \
                xorriso \
                squashfs-tools \
                isolinux \
                syslinux-common \
                syslinux-efi \
                grub-pc-bin \
                grub-efi-amd64-bin \
                mtools \
                dosfstools \
                dos2unix \
                ca-certificates \
                curl

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="/root/.cargo/bin:$PATH"

              cargo build --release -p mindset-os --bin mindset-shell --bin mindset-os
              cargo build --release -p mindset-focus-guard

              mkdir -p iso-builder/config/includes.chroot/usr/local/bin
              cp -f target/release/mindset-shell iso-builder/config/includes.chroot/usr/local/bin/mindset-shell
              cp -f target/release/mindset-os iso-builder/config/includes.chroot/usr/local/bin/mindset-os
              cp -f target/release/mindset-focus-guard iso-builder/config/includes.chroot/usr/local/bin/mindset-focus-guard
              chmod +x iso-builder/config/includes.chroot/usr/local/bin/mindset-*

              # Reclaim ~4 GB of target/ intermediate objects before live-build chroot & squashfs
              rm -rf /workspace/target

              find iso-builder -type f \( -name "*.sh" -o -name "*.hook.*" -o -path "*/auto/*" -o -name "mindset-session" -o -name "mindset-os-launch" -o -name "mindset-browser" -o -name "mindset-setup-ollama" -o -name "autostart" \) -exec dos2unix -q {} +
              cd iso-builder
              chmod +x build-iso.sh build_mindset_iso.sh auto/* config/hooks/live/*
              ./build-iso.sh
            '

      - name: Verify ISO Boot Catalog & QEMU Smoke Boot
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends xorriso qemu-system-x86 ovmf
          ls -lh iso-builder/mindset-os-amd64.hybrid.iso iso-builder/mindset-os-amd64.hybrid.iso.sha256
          cat iso-builder/mindset-os-amd64.hybrid.iso.sha256

          echo "=== Verifying El-Torito Hybrid Boot Catalog ==="
          xorriso -indev iso-builder/mindset-os-amd64.hybrid.iso -report_el_torito plain

          echo "=== Verifying ISO Size Under 2.5 GB ==="
          ISO_BYTES=$(stat -c%s iso-builder/mindset-os-amd64.hybrid.iso)
          echo "ISO Bytes: $ISO_BYTES"
          if [ "$ISO_BYTES" -gt 2684354560 ]; then
            echo "WARNING: ISO size exceeds 2.5 GB ($ISO_BYTES bytes)"
          fi

          echo "=== Running Headless QEMU Smoke Boot Test ==="
          KVM_FLAG=""
          if [ -e /dev/kvm ]; then
            KVM_FLAG="-enable-kvm"
          fi
          timeout 45s qemu-system-x86_64 $KVM_FLAG -m 2048 -smp 2 \
            -vga virtio -display none \
            -serial file:iso-builder/qemu-boot.log \
            -cdrom iso-builder/mindset-os-amd64.hybrid.iso || true
          ls -lh iso-builder/qemu-boot.log || true

      - name: Upload MindSet OS Bootable ISO & Logs
        uses: actions/upload-artifact@v4
        with:
          name: mindset-os-debian13-hybrid-iso
          path: |
            iso-builder/mindset-os-amd64.hybrid.iso
            iso-builder/mindset-os-amd64.hybrid.iso.sha256
            iso-builder/build.log
            iso-builder/qemu-boot.log
          retention-days: 14
