<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Clay Gradient -->
    <linearGradient id="clayGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="clayShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="10" stdDeviation="10" flood-color="#4338CA" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Canvas Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Neomorphic Base Plate -->
  <rect x="20" y="20" width="88" height="88" rx="24" fill="#1E293B" filter="url(#softShadow)"/>
  <rect x="21" y="21" width="86" height="86" rx="23" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Claymorphic Puffy Center Orb -->
  <circle cx="64" cy="64" r="30" fill="url(#clayGrad)" filter="url(#clayShadow)"/>
  <!-- Specular Rim Arc -->
  <path d="M 40 50 A 28 28 0 0 1 88 50" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75"/>
  <circle cx="50" cy="48" r="4" fill="#FFFFFF" opacity="0.85"/>

  <!-- Glassmorphic Overlay Diamond / Lens -->
  <polygon points="64,28 92,64 64,100 36,64" fill="url(#glassRim)" fill-opacity="0.22" stroke="url(#glassRim)" stroke-width="1.5" backdrop-filter="blur(16px)"/>

  <!-- Inspection Crosshair Reticle -->
  <circle cx="64" cy="64" r="14" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="64" y1="44" x2="64" y2="52" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="76" x2="64" y2="84" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="64" x2="52" y2="64" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="64" x2="84" y2="64" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="2.5" fill="#38BDF8"/>
</svg>